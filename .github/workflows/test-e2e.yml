name: E2E Tests

on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "e2e/**"
      - "packages/**"
      - "playwright.config.ts"
      - ".github/workflows/test-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "e2e/**"
      - "packages/**"
      - "playwright.config.ts"
      - ".github/workflows/test-e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://agentver:test@localhost:5432/agentver_test
      BETTER_AUTH_SECRET: test-secret-minimum-thirty-two-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      APP_URL: http://localhost:3001
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentver_test
          POSTGRES_USER: agentver
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run migrations
        run: bun run db:migrate:deploy

      - name: Seed categories
        run: bun run db:seed

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Build dashboard
        run: bun run turbo build --filter=@agentver/dashboard

      - name: Run E2E tests
        run: bunx playwright test

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 30
