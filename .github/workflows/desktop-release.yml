name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS and Windows builds disabled until code signing certificates are configured
          # - platform: macos-latest
          #   rust-target: aarch64-apple-darwin
          #   label: macOS (Apple Silicon)
          # - platform: macos-13
          #   rust-target: x86_64-apple-darwin
          #   label: macOS (Intel)
          # - platform: windows-latest
          #   rust-target: x86_64-pc-windows-msvc
          #   label: Windows
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            label: Linux

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Agentver Desktop ${{ github.ref_name }}"
          releaseBody: "See the [full changelog](https://github.com/agentver/agentver/blob/main/CHANGELOG.md) for details."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.rust-target }}
